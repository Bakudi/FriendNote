<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <meta name="description" content="Explora miles de apuntes universitarios organizados por carrera y materia. Filtra por Ingeniería, Medicina, Derecho y más."/>
<meta property="og:title" content="Explorar apuntes — Friendnote"/>
<link rel="canonical" href="https://friendnote.app/explorar.html"/>

  <title>Friendnote — Explorar</title>
  <link rel="stylesheet" href="css/main.css"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f4f6fb; color: #1a1a2e; min-height: 100vh; }
    nav { background: white; padding: 0 24px; height: 60px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 1px 8px rgba(0,0,0,0.06); position: sticky; top: 0; z-index: 100; }
    .nav-logo { font-size: 20px; font-weight: 700; color: #4f46e5; text-decoration: none; }
    .nav-links { display: flex; gap: 16px; align-items: center; }
    .nav-links a { font-size: 14px; color: #555; text-decoration: none; transition: color 0.2s; }
    .nav-links a:hover { color: #4f46e5; }
    .nav-links a.activo { color: #4f46e5; font-weight: 600; }
    .nav-avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; cursor: pointer; border: 2px solid #e0e0ff; }

    main { max-width: 960px; margin: 0 auto; padding: 40px 16px; }

    /* ── Hero búsqueda ── */
    .hero { text-align: center; margin-bottom: 36px; }
    .hero h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    .hero p { color: #777; font-size: 15px; margin-bottom: 24px; }

    .search-grande { display: flex; gap: 10px; max-width: 600px; margin: 0 auto; }
    .search-grande input { flex: 1; padding: 14px 18px; border: 1.5px solid #e0e0e0; border-radius: 12px; font-size: 16px; outline: none; transition: border 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .search-grande input:focus { border-color: #4f46e5; }
    .btn-buscar { padding: 14px 24px; background: #4f46e5; color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn-buscar:hover { background: #4338ca; }

    /* ── Filtros ── */
    .filtros { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 28px; }
    .filtros select { padding: 9px 14px; border: 1.5px solid #e0e0e0; border-radius: 8px; font-size: 14px; outline: none; background: white; cursor: pointer; transition: border 0.2s; }
    .filtros select:focus { border-color: #4f46e5; }

    .filtros-tags { display: flex; gap: 8px; flex-wrap: wrap; }
    .tag { padding: 6px 14px; background: white; border: 1.5px solid #e0e0e0; border-radius: 20px; font-size: 13px; cursor: pointer; transition: all 0.2s; }
    .tag:hover, .tag.activo { background: #4f46e5; color: white; border-color: #4f46e5; }

    /* ── Resultados ── */
    .resultados-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .resultados-count { font-size: 14px; color: #777; }
    .orden-select { padding: 7px 12px; border: 1.5px solid #e0e0e0; border-radius: 8px; font-size: 13px; outline: none; background: white; cursor: pointer; }

    .apuntes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }

    .apunte-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); text-decoration: none; color: inherit; display: block; transition: transform 0.2s, box-shadow 0.2s; }
    .apunte-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(79,70,229,0.12); }
    .apunte-materia { font-size: 11px; font-weight: 600; text-transform: uppercase; color: #4f46e5; background: #eef2ff; padding: 3px 8px; border-radius: 20px; display: inline-block; margin-bottom: 10px; }
    .apunte-titulo { font-size: 15px; font-weight: 600; margin-bottom: 6px; line-height: 1.3; }
    .apunte-descripcion { font-size: 13px; color: #777; margin-bottom: 12px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .apunte-footer { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #999; }
    .apunte-autor { display: flex; align-items: center; gap: 6px; }
    .apunte-autor img { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; }
    .apunte-stats { display: flex; gap: 10px; }

    .estado { text-align: center; padding: 60px 20px; color: #999; font-size: 15px; }
    .loading { text-align: center; padding: 60px 20px; color: #999; font-size: 15px; }
  </style>
</head>
<body>

  <nav>
    <a class="nav-logo" href="index.html">📚 Friendnote</a>
    <div class="nav-links">
      <a href="index.html">Inicio</a>
      <a href="explorar.html" class="activo">Explorar</a>
      <a href="subir.html">Subir</a>
      <img class="nav-avatar" id="user-avatar" src="https://ui-avatars.com/api/?name=U" alt="Perfil"
           onclick="window.location.href='perfil.html'"/>
    </div>
  </nav>

  <main>
    <div class="hero">
      <h1>Explora apuntes universitarios</h1>
      <p>Encuentra materiales de estudio de tu carrera y materia</p>
      <div class="search-grande">
        <input type="text" id="input-busqueda" placeholder="Buscar por título, materia..."/>
        <button class="btn-buscar" id="btn-buscar">Buscar</button>
      </div>
    </div>

    <div class="filtros">
      <select id="filtro-carrera">
        <option value="">Todas las carreras</option>
        <option>Ingeniería de Sistemas</option>
        <option>Administración</option>
        <option>Derecho</option>
        <option>Medicina</option>
        <option>Psicología</option>
        <option>Otra</option>
      </select>

      <div class="filtros-tags">
        <span class="tag activo" data-materia="">Todas</span>
        <span class="tag" data-materia="Cálculo">Cálculo</span>
        <span class="tag" data-materia="Programación">Programación</span>
        <span class="tag" data-materia="Estadística">Estadística</span>
        <span class="tag" data-materia="Base de Datos">Base de Datos</span>
        <span class="tag" data-materia="Redes">Redes</span>
      </div>
    </div>

    <div class="resultados-header">
      <span class="resultados-count" id="resultados-count">Cargando...</span>
      <select class="orden-select" id="orden-select">
        <option value="created_at">Más recientes</option>
        <option value="total_descargas">Más descargados</option>
        <option value="valoracion_promedio">Mejor valorados</option>
      </select>
    </div>

    <div id="apuntes-container" class="apuntes-grid">
      <div class="loading">⏳ Cargando apuntes...</div>
    </div>
  </main>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const supabase = createClient(
      'https://ojwnvijcyrddpadyyoce.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qd252aWpjeXJkZHBhZHl5b2NlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0ODUxNzcsImV4cCI6MjA5NTA2MTE3N30.Lg-NuNcwWcI8hwmost-TtJQ0YzlSDTZE2ciL9BtK0yQ'
    )

    async function init() {
      const { data: { user } } = await supabase.auth.getUser()
      if (!user) { window.location.href = '/login.html'; return }

      if (user.user_metadata?.avatar_url) {
        document.getElementById('user-avatar').src = user.user_metadata.avatar_url
      }

      await cargarApuntes()
    }

    let materiaActiva = ''
    let busquedaTimer = null

    async function cargarApuntes() {
      const busqueda = document.getElementById('input-busqueda').value.trim()
      const carrera  = document.getElementById('filtro-carrera').value
      const orden    = document.getElementById('orden-select').value
      const container = document.getElementById('apuntes-container')

      container.innerHTML = '<div class="loading">⏳ Cargando apuntes...</div>'

      let query = supabase
        .from('apuntes')
        .select('*')
        .order(orden, { ascending: false })

      if (carrera)       query = query.eq('carrera', carrera)
      if (materiaActiva) query = query.eq('materia', materiaActiva)
      if (busqueda)      query = query.ilike('titulo', `%${busqueda}%`)

      const { data: apuntes, error } = await query

      if (error) {
        container.innerHTML = '<div class="estado">❌ Error al cargar apuntes.</div>'
        return
      }

      document.getElementById('resultados-count').textContent =
        `${apuntes?.length ?? 0} apunte${apuntes?.length !== 1 ? 's' : ''} encontrado${apuntes?.length !== 1 ? 's' : ''}`

      if (!apuntes || apuntes.length === 0) {
        container.innerHTML = '<div class="estado">📭 No se encontraron apuntes con esos filtros.</div>'
        return
      }

      container.innerHTML = apuntes.map(a => `
        <a class="apunte-card" href="detalle.html?id=${a.id}">
          <span class="apunte-materia">${a.materia}</span>
          <div class="apunte-titulo">${a.titulo}</div>
          <div class="apunte-descripcion">${a.descripcion ?? 'Sin descripción'}</div>
          <div class="apunte-footer">
            <div class="apunte-autor">
              <img src="${a.usuario_avatar ?? `https://ui-avatars.com/api/?name=${a.usuario_nombre}`}" alt="${a.usuario_nombre}"/>
              ${a.usuario_nombre}
            </div>
            <div class="apunte-stats">
              ⭐ ${a.valoracion_promedio ?? '0'}
              &nbsp;⬇️ ${a.total_descargas ?? 0}
            </div>
          </div>
        </a>
      `).join('')
    }

    // ── Eventos ──
    document.getElementById('input-busqueda').addEventListener('input', () => {
      clearTimeout(busquedaTimer)
      busquedaTimer = setTimeout(cargarApuntes, 400)
    })

    document.getElementById('btn-buscar').addEventListener('click', cargarApuntes)

    document.getElementById('filtro-carrera').addEventListener('change', cargarApuntes)

    document.getElementById('orden-select').addEventListener('change', cargarApuntes)

    document.querySelectorAll('.tag').forEach(tag => {
      tag.addEventListener('click', () => {
        document.querySelectorAll('.tag').forEach(t => t.classList.remove('activo'))
        tag.classList.add('activo')
        materiaActiva = tag.dataset.materia
        cargarApuntes()
      })
    })

    // Enter en el buscador
    document.getElementById('input-busqueda').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') cargarApuntes()
    })

    init()
  </script>

</body>
</html>
