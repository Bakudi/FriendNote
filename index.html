<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Friendnote — Comparte y descarga apuntes universitarios gratis."/>
  <meta name="keywords" content="apuntes universitarios, materiales de estudio, Colombia"/>
  <meta property="og:title" content="Friendnote — Apuntes universitarios"/>
  <meta property="og:description" content="Comparte y descarga apuntes universitarios gratis."/>
  <meta property="og:type" content="website"/>
  <link rel="manifest" href="/manifest.json"/>
  <title>Friendnote — Home</title>
  <link rel="stylesheet" href="css/main.css"/>
  <link rel="stylesheet" href="css/components.css"/>
  <style>
    .search-bar { display: flex; gap: 10px; margin-bottom: 24px; }
    .search-bar input { flex: 1; padding: 12px 16px; border: 1.5px solid var(--border, #e0e0e0); border-radius: 10px; font-size: 15px; outline: none; transition: border 0.2s; font-family: inherit; }
    .search-bar input:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
    .search-bar select { padding: 12px 14px; border: 1.5px solid var(--border, #e0e0e0); border-radius: 10px; font-size: 14px; outline: none; background: white; cursor: pointer; font-family: inherit; }
    .apunte-materia { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: #4f46e5; background: #eef2ff; padding: 3px 8px; border-radius: 20px; display: inline-block; margin-bottom: 10px; }
    .apunte-titulo { font-size: 16px; font-weight: 600; margin-bottom: 6px; line-height: 1.3; }
    .apunte-descripcion { font-size: 13px; color: #777; margin-bottom: 14px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .apunte-footer { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #999; }
    .apunte-autor { display: flex; align-items: center; gap: 6px; }
    .apunte-autor img { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; }
    .apunte-stats { display: flex; gap: 10px; }
    .apuntes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .apunte-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); text-decoration: none; color: inherit; display: block; transition: transform 0.2s, box-shadow 0.2s; }
    .apunte-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(79,70,229,0.12); }
    .estado { text-align: center; padding: 60px 20px; color: #999; }
    .estado p { font-size: 15px; margin-top: 8px; }
    nav { background: white; padding: 0 24px; height: 60px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 1px 8px rgba(0,0,0,0.06); position: sticky; top: 0; z-index: 100; }
    .nav-logo { font-size: 20px; font-weight: 700; color: #4f46e5; text-decoration: none; }
    .nav-actions { display: flex; align-items: center; gap: 12px; }
    .nav-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; cursor: pointer; border: 2px solid #e0e0ff; transition: transform 0.2s; }
    .nav-avatar:hover { transform: scale(1.05); }
    .btn-subir { background: #4f46e5; color: white; border: none; border-radius: 8px; padding: 8px 16px; font-size: 14px; font-weight: 500; cursor: pointer; text-decoration: none; transition: background 0.2s, transform 0.2s; }
    .btn-subir:hover { background: #4338ca; transform: translateY(-1px); }
    main { max-width: 900px; margin: 0 auto; padding: 32px 16px; }
    @media (max-width: 600px) { .search-bar { flex-direction: column; } .search-bar select { width: 100%; } }
  </style>
</head>
<body>

  <nav>
    <a class="nav-logo" href="index.html">📚 Friendnote</a>
    <div class="nav-actions">
      <a class="btn-subir" href="subir.html" data-i18n="nav_subir">+ Subir apunte</a>
      <img class="nav-avatar" id="user-avatar"
           src="https://ui-avatars.com/api/?name=U"
           alt="Ver perfil"
           aria-label="Ver mi perfil"
           onclick="window.location.href='perfil.html'"/>
    </div>
  </nav>

  <main>
    <div class="search-bar">
      <input type="text" id="input-busqueda"
             data-i18n-placeholder="buscar_placeholder"
             placeholder="Buscar apuntes por título..."
             aria-label="Buscar apuntes"/>
      <select id="filtro-carrera" aria-label="Filtrar por carrera">
        <option value="" data-i18n="filtro_carreras">Todas las carreras</option>
        <option value="Ingeniería de Sistemas">Ing. Sistemas</option>
        <option value="Administración">Administración</option>
        <option value="Derecho">Derecho</option>
        <option value="Medicina">Medicina</option>
        <option value="Psicología">Psicología</option>
      </select>
    </div>

    <div id="apuntes-container" class="apuntes-grid">
      <div class="estado">⏳ <p data-i18n="cargando">Cargando apuntes...</p></div>
    </div>
  </main>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
    import { insertarSelectorIdioma, t } from './js/i18n.js'

    const supabase = createClient(
      'https://ojwnvijcyrddpadyyoce.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qd252aWpjeXJkZHBhZHl5b2NlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0ODUxNzcsImV4cCI6MjA5NTA2MTE3N30.Lg-NuNcwWcI8hwmost-TtJQ0YzlSDTZE2ciL9BtK0yQ'
    )

    let busquedaTimer = null

    async function init() {
      const { data: { user } } = await supabase.auth.getUser()
      if (!user) { window.location.href = '/login.html'; return }

      if (user?.user_metadata?.avatar_url) {
        document.getElementById('user-avatar').src = user.user_metadata.avatar_url
      }

      insertarSelectorIdioma()
      await cargarApuntes()

      document.getElementById('input-busqueda').addEventListener('input', () => {
        clearTimeout(busquedaTimer)
        busquedaTimer = setTimeout(cargarApuntes, 400)
      })
      document.getElementById('filtro-carrera').addEventListener('change', cargarApuntes)
    }

    async function cargarApuntes() {
      const busqueda  = document.getElementById('input-busqueda').value.trim()
      const carrera   = document.getElementById('filtro-carrera').value
      const container = document.getElementById('apuntes-container')

      container.innerHTML = `<div class="estado">⏳ <p>${t('cargando')}</p></div>`

      let query = supabase.from('apuntes').select('*').order('created_at', { ascending: false })
      if (carrera)  query = query.eq('carrera', carrera)
      if (busqueda) query = query.ilike('titulo', `%${busqueda}%`)

      const { data: apuntes } = await query

      if (!apuntes || apuntes.length === 0) {
        container.innerHTML = `<div class="estado">📭 <p>${t('sin_apuntes')}</p></div>`
        return
      }

      container.innerHTML = apuntes.map(a => `
        <a class="apunte-card" href="detalle.html?id=${a.id}">
          <span class="apunte-materia">${a.materia}</span>
          <div class="apunte-titulo">${a.titulo}</div>
          <div class="apunte-descripcion">${a.descripcion ?? 'Sin descripción'}</div>
          <div class="apunte-footer">
            <div class="apunte-autor">
              <img src="${a.usuario_avatar ?? `https://ui-avatars.com/api/?name=${a.usuario_nombre}`}"
                   alt="${a.usuario_nombre}"/>
              ${a.usuario_nombre}
            </div>
            <div class="apunte-stats">
              ⭐ ${a.valoracion_promedio ?? '—'}
              &nbsp;⬇️ ${a.total_descargas ?? 0}
            </div>
          </div>
        </a>
      `).join('')
    }

    init()
  </script>

</body>
</html>
