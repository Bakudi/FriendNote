<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- SEO -->
  <meta name="description" content="Friendnote — Comparte y descarga apuntes universitarios gratis."/>
  <meta name="keywords" content="apuntes universitarios, materiales de estudio, Colombia"/>
  <meta property="og:title" content="Friendnote — Apuntes universitarios"/>
  <meta property="og:description" content="Comparte y descarga apuntes universitarios gratis."/>
  <meta property="og:type" content="website"/>
  
  <title>Friendnote — Home</title>
  <link rel="stylesheet" href="css/main.css"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f6fb;
      color: #1a1a2e;
    }

    /* ── Navbar ── */
    nav {
      background: white;
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 1px 8px rgba(0,0,0,0.06);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-logo {
      font-size: 20px;
      font-weight: 700;
      color: #4f46e5;
      text-decoration: none;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      cursor: pointer;
      border: 2px solid #e0e0ff;
    }

    .btn-subir {
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }

    .btn-subir:hover { background: #4338ca; }

    /* ── Contenido principal ── */
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 16px;
    }

    /* ── Buscador ── */
    .search-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    .search-bar input {
      flex: 1;
      padding: 12px 16px;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: border 0.2s;
    }

    .search-bar input:focus { border-color: #4f46e5; }

    .search-bar select {
      padding: 12px 14px;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      background: white;
      cursor: pointer;
    }

    /* ── Grid de apuntes ── */
    .apuntes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    /* ── Card de apunte ── */
    .apunte-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .apunte-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(79,70,229,0.12);
    }

    .apunte-materia {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #4f46e5;
      background: #eef2ff;
      padding: 3px 8px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 10px;
    }

    .apunte-titulo {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .apunte-descripcion {
      font-size: 13px;
      color: #777;
      margin-bottom: 14px;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .apunte-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: #999;
    }

    .apunte-autor {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .apunte-autor img {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      object-fit: cover;
    }

    .apunte-stats {
      display: flex;
      gap: 10px;
    }

    /* ── Estado vacío / cargando ── */
    .estado {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }

    .estado p { font-size: 15px; margin-top: 8px; }
  </style>
</head>
<body>

  <nav>
    <a class="nav-logo" href="index.html">📚 Friendnote</a>
    <div class="nav-actions">
      <a class="btn-subir" href="subir.html">+ Subir apunte</a>
      <img class="nav-avatar" id="user-avatar" src="https://ui-avatars.com/api/?name=U" alt="Perfil"
           onclick="window.location.href='perfil.html'"/>
    </div>
  </nav>

  <main>
    <div class="search-bar">
      <input type="text" id="input-busqueda" placeholder="Buscar apuntes por título..."/>
      <select id="filtro-carrera">
        <option value="">Todas las carreras</option>
        <option value="Ingeniería de Sistemas">Ing. Sistemas</option>
        <option value="Administración">Administración</option>
        <option value="Derecho">Derecho</option>
        <option value="Medicina">Medicina</option>
        <option value="Psicología">Psicología</option>
      </select>
    </div>

    <div id="apuntes-container" class="apuntes-grid">
      <div class="estado">⏳ <p>Cargando apuntes...</p></div>
    </div>
  </main>

  <script type="module">
    import { protegerPagina } from './js/auth.js'
    import { obtenerApuntes } from './js/apuntes.js'

    let busquedaTimer = null

    // Proteger página
    const user = await protegerPagina()

    // Mostrar avatar del usuario
    if (user?.user_metadata?.avatar_url) {
      document.getElementById('user-avatar').src = user.user_metadata.avatar_url
    }

    // Cargar apuntes iniciales
    await cargarApuntes()

    // Buscar al escribir (con debounce)
    document.getElementById('input-busqueda').addEventListener('input', (e) => {
      clearTimeout(busquedaTimer)
      busquedaTimer = setTimeout(() => cargarApuntes(), 400)
    })

    // Filtrar por carrera
    document.getElementById('filtro-carrera').addEventListener('change', () => cargarApuntes())

    async function cargarApuntes() {
      const busqueda = document.getElementById('input-busqueda').value.trim()
      const carrera  = document.getElementById('filtro-carrera').value
      const container = document.getElementById('apuntes-container')

      container.innerHTML = '<div class="estado">⏳ <p>Cargando apuntes...</p></div>'

      const { data: apuntes } = await obtenerApuntes({ busqueda, carrera })

      if (!apuntes || apuntes.length === 0) {
        container.innerHTML = '<div class="estado">📭 <p>No se encontraron apuntes.</p></div>'
        return
      }

      container.innerHTML = apuntes.map(apunte => `
        <a class="apunte-card" href="detalle.html?id=${apunte.id}">
          <span class="apunte-materia">${apunte.materia}</span>
          <div class="apunte-titulo">${apunte.titulo}</div>
          <div class="apunte-descripcion">${apunte.descripcion ?? 'Sin descripción'}</div>
          <div class="apunte-footer">
            <div class="apunte-autor">
              <img src="${apunte.usuario_avatar ?? `https://ui-avatars.com/api/?name=${apunte.usuario_nombre}`}"
                   alt="${apunte.usuario_nombre}"/>
              ${apunte.usuario_nombre}
            </div>
            <div class="apunte-stats">
              ⭐ ${apunte.valoracion_promedio ?? '—'}
              &nbsp;⬇️ ${apunte.total_descargas ?? 0}
            </div>
          </div>
        </a>
      `).join('')
    }
  </script>

</body>
</html>
